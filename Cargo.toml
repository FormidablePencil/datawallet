[package]
name = "datawallet"
version = "0.1.0"
edition = "2021"
description = "(dynamic) DataWallet - A dynamic data registry and mnemonic PAO indexing system"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

dioxus = { version = "0.7", features = ["fullstack", "signals"] }
mongodb = { version = "3.2", features = ["sync"], optional = true }
bson = { version = "2.13", features = ["chrono-0_4"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
wasm-bindgen = "0.2"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "mongodb", "bson"]

# Web build configuration
[profile.release]
opt-level = 3
lto = true

[package.metadata.dioxus]
default_platform = "web"